<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>내일 점심 도시락 선택</title><style>:root{--bg:#f6f7f8;--card:#fff;--text:#171717;--muted:#717171;--line:#e8e8e8;--accent:#f59e0b;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 44px}.hero{background:linear-gradient(135deg,#fff8e8,#fff);border:1px solid #f5e6bf;border-radius:22px;padding:22px 18px;margin-bottom:14px;box-shadow:0 5px 18px #0000000a}.eyebrow{font-size:13px;font-weight:800;color:#b45309;margin-bottom:6px}.hero h1{font-size:27px;line-height:1.25;margin:0 0 8px}.hero p{margin:4px 0;color:var(--muted);font-size:14px}.deadline{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid #f2dfb0;padding:12px 13px;border-radius:14px}.deadline strong{font-size:15px}.countdown{font-variant-numeric:tabular-nums;font-weight:800;color:#b45309}.namebox{position:sticky;top:0;z-index:10;padding:9px 0;background:linear-gradient(var(--bg) 75%,#f6f7f800)}.nameinner{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 4px 14px #0000000d}input{width:100%;border:0;outline:0;font-size:16px;padding:9px 10px;background:transparent}.namehint{font-size:12px;color:var(--muted);padding:2px 4px 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);background:var(--card);border-radius:19px;overflow:hidden;box-shadow:0 3px 12px #00000009;transition:.15s}.card:active{transform:scale(.985)}.card.selected{border:2px solid var(--accent);box-shadow:0 7px 24px #f59e0b2b}.photo{height:170px;background:#f5f2eb;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo:after{content:"본도시락";position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;color:#986a16;background:#ffffffe8;padding:5px 7px;border-radius:99px}.body{padding:14px}.title{font-weight:850;font-size:16px;line-height:1.35;min-height:43px}.price{font-size:16px;font-weight:850;margin-top:5px}.desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45;min-height:34px}.pick{margin-top:11px;width:100%;border:0;border-radius:12px;padding:11px 8px;font-size:14px;font-weight:850;background:#f2f2f2}.selected .pick{background:var(--accent);color:#fff}.people{border-top:1px solid var(--line);padding:10px 14px 13px;min-height:55px}.count{font-size:12px;color:var(--muted);margin-bottom:6px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:12px;font-weight:750;padding:5px 8px;border-radius:999px;background:#f3f4f6}.empty{font-size:12px;color:#aaa}.summary{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px}.summary h2{font-size:18px;margin:0 0 12px}.sumrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #eee;font-size:14px}.sumrow:last-child{border:0}.total{margin-top:13px;padding-top:12px;border-top:2px solid #222;display:flex;justify-content:space-between;font-weight:900}.notice{margin-top:12px;color:var(--muted);font-size:12px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:750;opacity:0;pointer-events:none;transition:.2s;z-index:50}.toast.show{opacity:1}.closed{background:#fff1f2!important;border-color:#fecdd3!important}.closed .countdown{color:var(--danger)}@media(max-width:560px){.wrap{padding:12px 10px 34px}.hero{padding:19px 15px}.hero h1{font-size:24px}.grid{gap:9px}.photo{height:145px}.body{padding:12px}.title{font-size:14px;min-height:39px}.price{font-size:15px}.desc{font-size:11px;min-height:32px}.people{padding:9px 11px 12px}.chip{font-size:11px}.pick{font-size:13px}}</style></head><body><div class="wrap"><section class="hero"><div class="eyebrow">🍱 본도시락 이수점</div><h1>내일 점심, 먹고 싶은 메뉴 골라주세요</h1><p>이름을 적고 메뉴 하나를 누르면 바로 등록됩니다.</p><p>다른 메뉴를 다시 누르면 기존 선택이 자동으로 바뀝니다.</p><div class="deadline" id="deadlineBox"><strong>⏰ 주문 마감 · 9월 13일 오전 10:30</strong><span class="countdown" id="countdown">계산 중</span></div></section><div class="namebox"><div class="nameinner"><input id="name" maxlength="12" autocomplete="name" placeholder="이름 입력 (예: 김상훈)"></div><div class="namehint">※ 같은 이름으로 다시 고르면 메뉴가 변경됩니다.</div></div><main class="grid" id="menuGrid"></main><section class="summary"><h2>📋 현재 주문 현황</h2><div id="summaryRows"></div><div class="total"><span>총 주문</span><span id="grandTotal">0개 · 0원</span></div></section><div class="notice">10:30 이후에는 자동 마감됩니다. 선택 현황은 주기적으로 새로고침됩니다.</div></div><div class="toast" id="toast"></div><script>const API_URL='https://script.google.com/macros/s/AKfycbx1NMn-Z_eR2hnI1cHcpL5QRxGYdFR6n_6JXw1RMIzLbCQPCCqM_U_hd7bT7M6e_oU5/exec',DEADLINE=new Date('2026-09-13T10:30:00+09:00');const menus=[{id:'beef',name:'버섯소불고기 국반상',price:10900,img:'https://d3af5evjz6cdzs.cloudfront.net/images/uploads/800x0/mushroom-bulgogi-soup-set_b753541813e0b1da0dc83956a82db17f1728034085.jpg',desc:'버섯소불고기 · 국 · 튀김&전 · 한식반찬'},{id:'squid',name:'오징어두루치기 국반상',price:10900,img:'https://limebanchan.com/data/item/1626826879/1_7J206647KeA.jpg',desc:'오징어두루치기 · 국 · 튀김&전 · 한식반찬'},{id:'pork',name:'깻잎제육 국반상',price:10500,img:'https://cdn-optimized.imweb.me/upload/S20230915a616c028b704a/761e3868a0972.jpg?w=500',desc:'깻잎제육볶음 · 국 · 계란후라이 · 튀김&전'},{id:'bbqbeef',name:'바싹불고기 국반상',price:9900,img:'https://img.danawa.com/prod_img/500000/594/582/img/6582594_1.jpg?_v=20181109152945&shrink=360%3A360',desc:'바싹불고기 · 국 · 계란후라이 · 튀김&전'},{id:'chicken',name:'숯불닭구이 국반상',price:9900,img:'https://item.elandrs.com/upload/prd/orgimg/444/2208189444_0000001.jpg?h=&q=100&w=750',desc:'숯불 고추장닭구이 · 국 · 튀김&전 · 한식반찬'},{id:'katsu',name:'본격도시락 (가츠&선)',price:8800,img:'https://erp.sbpack.kr/Upload/Item/1000002485_PresentImage1URL.jpg?time=20260331104718253',desc:'돈카츠 중심 본격도시락'}];let orders=[],myName=localStorage.getItem('lunch_name')||'',saveSeq=0;name.value=myName;const money=n=>n.toLocaleString('ko-KR')+'원',isClosed=()=>Date.now()>=DEADLINE.getTime();function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function render(){const g=menuGrid,selected=orders.find(o=>o.name===myName)?.menuId;g.innerHTML='';menus.forEach(m=>{const people=orders.filter(o=>o.menuId===m.id).map(o=>o.name),e=document.createElement('article');e.className='card'+(selected===m.id?' selected':'');e.innerHTML=`<div class="photo"><img src="${m.img}" alt="${m.name}" loading="eager"></div><div class="body"><div class="title">${m.name}</div><div class="price">${money(m.price)}</div><div class="desc">${m.desc}</div><button class="pick" ${isClosed()?'disabled':''}>${selected===m.id?'✓ 내가 선택한 메뉴':'이 메뉴 선택'}</button></div><div class="people"><div class="count">선택 ${people.length}명</div><div class="chips">${people.length?people.map(p=>`<span class="chip">${esc(p)}</span>`).join(''):'<span class="empty">아직 선택한 사람이 없어요</span>'}</div></div>`;e.querySelector('.pick').onclick=()=>pick(m);g.appendChild(e)});renderSummary()}function renderSummary(){let total=0,amount=0;summaryRows.innerHTML=menus.map(m=>{const n=orders.filter(o=>o.menuId===m.id).length;total+=n;amount+=n*m.price;return `<div class="sumrow"><span>${m.name}</span><b>${n}개</b></div>`}).join('');grandTotal.textContent=`${total}개 · ${money(amount)}`}function jsonp(params,done,fail){const cb='lunchCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=d=>{try{done(d)}finally{delete window[cb];s.remove()}};s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb,t:Date.now()});s.onerror=()=>{s.remove();delete window[cb];fail&&fail()};document.body.appendChild(s)}function pick(menu){const n=name.value.trim();if(!n){toast('먼저 이름을 입력해주세요');name.focus();return}if(isClosed()){toast('주문이 마감됐어요');return}myName=n;localStorage.setItem('lunch_name',n);const before=orders.map(o=>({...o}));orders=orders.filter(o=>o.name!==n);orders.push({name:n,menuId:menu.id,menuName:menu.name,price:menu.price,pending:true});render();toast(menu.name+' 선택');const seq=++saveSeq;jsonp({action:'pick',name:n,menuId:menu.id,menuName:menu.name,price:menu.price},d=>{if(seq!==saveSeq)return;if(d&&d.ok){orders=Array.isArray(d.orders)?d.orders:orders;render()}else{orders=before;render();toast('저장에 실패했어요')}},()=>{if(seq!==saveSeq)return;orders=before;render();toast('저장에 실패했어요')})}function loadOrders(){jsonp({},d=>{if(Array.isArray(d.orders)){orders=d.orders;render()}},()=>{})}function tick(){const d=DEADLINE-Date.now();if(d<=0){countdown.textContent='마감';deadlineBox.classList.add('closed');return}const h=Math.floor(d/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);countdown.textContent=h>24?Math.floor(h/24)+'일 '+h%24+'시간':`${h}시간 ${m}분 ${s}초`}loadOrders();tick();setInterval(tick,1000);setInterval(loadOrders,15000);name.addEventListener('change',e=>{myName=e.target.value.trim();localStorage.setItem('lunch_name',myName);render()});</script></body></html>
